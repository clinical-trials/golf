<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-label="Tom Harris Golf">
  <!-- bright-gold swoosh: sweeps up under the monogram, out to the flag -->
  <path d="M58 210 C140 150 248 150 350 190" fill="none" stroke="#E3A81C" stroke-width="13" stroke-linecap="round"/>
  <!-- bright-gold flag, planted at the swoosh's end -->
  <line x1="350" y1="86" x2="350" y2="192" stroke="#E3A81C" stroke-width="7" stroke-linecap="round"/>
  <path d="M354 92 L397 107 L354 127 Z" fill="#E3A81C"/>
  <!-- TH monogram: T forest-green, H charcoal -->
  <text x="212" y="206" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="176" letter-spacing="-10"><tspan fill="#2C7A3D">T</tspan><tspan fill="#1C2A26">H</tspan></text>
  <!-- TOM HARRIS -->
  <text x="220" y="270" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="48" letter-spacing="1" fill="#1C2A26">TOM HARRIS</text>
  <!-- GOLF with flanking rules -->
  <line x1="66" y1="305" x2="146" y2="305" stroke="#2C7A3D" stroke-width="3"/>
  <text x="220" y="318" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="31" letter-spacing="6" fill="#2C7A3D">GOLF</text>
  <line x1="294" y1="305" x2="374" y2="305" stroke="#2C7A3D" stroke-width="3"/>
</svg>
