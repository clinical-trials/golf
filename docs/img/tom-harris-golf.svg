<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 366" role="img" aria-label="Tom Harris Golf">
  <!-- gold swoosh: sweeps up over the monogram, then swoops down into the hole -->
  <path d="M40 262 C150 176 300 150 366 248" fill="none" stroke="#E9B949" stroke-width="15" stroke-linecap="round"/>
  <!-- the hole (cup) the swoosh dives into, at the flag base -->
  <ellipse cx="368" cy="250" rx="16" ry="5" fill="none" stroke="#E9B949" stroke-width="4"/>
  <!-- gold flag, planted in the hole -->
  <line x1="368" y1="118" x2="368" y2="250" stroke="#E9B949" stroke-width="7" stroke-linecap="round"/>
  <path d="M372 124 L414 139 L372 158 Z" fill="#E9B949"/>
  <!-- TH monogram: T green, H cream -->
  <text x="218" y="226" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="186" letter-spacing="-12"><tspan fill="#8FB264">T</tspan><tspan fill="#ECE6D6">H</tspan></text>
  <!-- TOM HARRIS -->
  <text x="220" y="296" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="49" letter-spacing="2" fill="#ECE6D6">TOM HARRIS</text>
  <!-- GOLF with flanking rules -->
  <line x1="90" y1="333" x2="168" y2="333" stroke="#8FB264" stroke-width="3"/>
  <text x="220" y="347" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="37" letter-spacing="9" fill="#8FB264">GOLF</text>
  <line x1="274" y1="333" x2="352" y2="333" stroke="#8FB264" stroke-width="3"/>
</svg>
